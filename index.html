<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Painel de Inaugurações — Grupo Ragga Foods</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#F5F3F7;--white:#FFF;--card:#FFF;--surface:#F0ECF3;--border:#E0D8E8;--text:#1E1230;--muted:#6B5F7A;--dim:#A89BB5;--brand:#3B2758;--brand-soft:rgba(59,39,88,.08)}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif}
.hd{background:var(--white);padding:24px 32px 20px;border-bottom:1px solid var(--border)}
.hd-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.logo{height:32px}
.badge{background:var(--brand-soft);border-radius:20px;padding:5px 14px;font-size:10px;color:var(--brand);font-weight:600}
.hero{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:2px}
.hv{font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:700;color:var(--brand);line-height:1}
.hl{font-size:12px;color:var(--muted);font-weight:500}
.hs{font-size:10px;color:var(--dim)}
.tabs{background:var(--white);padding:0 32px;border-bottom:1px solid var(--border);display:flex}
.tab{padding:10px 18px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;font-family:'Inter',sans-serif;background:none;border-top:none;border-left:none;border-right:none}
.tab:hover{color:var(--brand)}.tab.a{color:var(--brand);border-bottom-color:var(--brand)}
.fl{background:var(--white);padding:12px 32px;border-bottom:1px solid var(--border);display:flex;gap:5px;flex-wrap:wrap}
.fb{background:var(--white);border:1.5px solid var(--border);border-radius:16px;padding:4px 10px;font-size:9px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:4px;font-family:'Inter',sans-serif}
.fb:hover{border-color:var(--brand);color:var(--brand)}.fb.a{background:var(--brand);border-color:var(--brand);color:#fff}.fb .d{width:5px;height:5px;border-radius:50%}
.wrap{padding:32px 48px}
.tc{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(59,39,88,.03)}
.ct{font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;color:var(--brand);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.ti{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:9px 11px;transition:all .2s;cursor:pointer}
.ti:hover{border-color:var(--brand);transform:translateY(-1px)}.ti.hb{border-left:3px solid #1A9F4A}.ti.nb{border-left:3px solid var(--dim);opacity:.35;cursor:default}.ti.nb:hover{transform:none;border-color:var(--border)}.ti.oc{opacity:.2;cursor:default}.ti.oc:hover{transform:none}
.td{font-size:8px;font-weight:700;color:#E8650A;letter-spacing:1px;margin-bottom:2px}.tn{font-size:9px;font-weight:600;line-height:1.3}.tv{font-size:8px;font-weight:700;color:#1A9F4A;margin-top:3px}
.tt{font-size:6px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 4px;border-radius:8px;margin-top:3px;display:inline-block}
.tt.b{background:rgba(26,159,74,.1);color:#1A9F4A}.tt.p{background:rgba(168,155,181,.15);color:var(--muted)}.tt.oc{background:rgba(168,155,181,.08);color:var(--dim)}
.og{display:grid;grid-template-columns:1fr 280px;gap:16px}.cw{position:relative;height:240px}
.sc{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(59,39,88,.03)}
.bi{display:flex;justify-content:space-between;align-items:center;padding:6px 4px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:5px;transition:background .15s}
.bi:hover{background:var(--surface)}.bi:last-child{border:none}
.bi-l{display:flex;align-items:center;gap:5px}.bi-d{width:7px;height:7px;border-radius:3px}.bi-n{font-size:9px;font-weight:500}
.bi-v{font-size:9px;font-weight:700;font-variant-numeric:tabular-nums}.bi-p{font-size:8px;color:var(--muted);margin-left:4px}.bi-a{font-size:9px;color:var(--dim);margin-left:4px}
.pb{height:5px;background:var(--surface);border-radius:3px;overflow:hidden;display:flex;margin:8px 0 6px}.pb-s{height:100%}
.sr{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-top:8px}.sb{background:var(--surface);border-radius:6px;padding:8px;text-align:center}.sb .sv{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700}.sb .sl{font-size:6px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-top:2px}
/* Budget detail */
.bb{background:var(--white);border:1.5px solid var(--border);border-radius:20px;padding:8px 20px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;font-family:'Inter',sans-serif;margin-bottom:16px;display:inline-flex;align-items:center;gap:4px}.bb:hover{border-color:var(--brand);color:var(--brand)}
.bh{display:flex;align-items:center;gap:16px;margin-bottom:24px;padding-bottom:18px;border-bottom:2px solid var(--border);flex-wrap:wrap}
.bh-b{width:4px;height:40px;border-radius:2px;flex-shrink:0}.bh-i{flex:1;min-width:160px}.bh-n{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700}.bh-m{font-size:13px;color:var(--muted);margin-top:2px}.bh-t{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700;text-align:right}
.bs-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:28px}
.bs-c{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}.bs-l{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:3px;font-weight:600}.bs-v{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;white-space:nowrap}.bs-p{font-size:10px;color:var(--muted);margin-top:1px}.bs-c.pj{border-style:dashed;background:var(--surface)}
.bx{margin-bottom:24px}.bx-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:4px}.bx-t{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;display:flex;align-items:center;gap:5px}.bx-ic{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px}.bx-st{font-size:13px;color:var(--muted);font-weight:600}.bx-st strong{color:var(--text);font-size:15px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.t{width:100%;border-collapse:separate;border-spacing:0 2px;min-width:360px}.t thead th{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);font-weight:700;padding:0 6px 3px;text-align:left}.t thead th.r{text-align:right}.t tbody tr{background:var(--white)}.t tbody tr:hover{background:var(--surface)}.t tbody td{padding:10px 12px;font-size:13px;border:1px solid var(--border);border-left:none;border-right:none}.t tbody td:first-child{border-left:1px solid var(--border);border-radius:4px 0 0 4px}.t tbody td:last-child{border-right:1px solid var(--border);border-radius:0 4px 4px 0}
.t .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}.t .o{text-align:right;font-size:12px;color:var(--muted)}.t .ds{font-weight:500}
.fg{display:inline-flex;font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 4px;border-radius:8px;margin-left:3px}.fw{background:rgba(201,148,10,.1);color:#C9940A}.fk{background:rgba(26,159,74,.1);color:#1A9F4A}
/* Cash Flow */
.cf-chart{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}.cf-cw{position:relative;height:280px}
.cf-tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cf-t{width:100%;border-collapse:separate;border-spacing:0;min-width:900px}
.cf-t th{font-size:7px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;padding:7px 6px;text-align:right;border-bottom:2px solid var(--border);background:var(--white);position:sticky;top:0}
.cf-t th:first-child{text-align:left}
.cf-t td{padding:7px 6px;font-size:9px;text-align:right;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.cf-t td:first-child{text-align:left;font-weight:600}
.cf-t tr:hover td{background:var(--surface)}
.cf-pn{display:flex;align-items:center;gap:5px}.cf-pd{width:7px;height:7px;border-radius:3px;flex-shrink:0}
.cf-t tr.cf-total td{font-weight:800;font-size:10px;border-top:2px solid var(--brand);background:var(--brand-soft);color:var(--brand)}
.cf-t tr.cf-cum td{font-weight:700;font-size:9px;color:var(--muted);font-style:italic}
.cf-pk{background:rgba(217,70,239,.06)!important;font-weight:700!important;color:#D946EF!important}
.cf-exp{font-size:7px;color:var(--dim);margin-right:3px;display:inline-block;transition:.2s}.cf-pr{cursor:pointer}.cf-pr:hover{background:var(--surface)!important}.cf-pr:hover .cf-exp{color:var(--brand)}
.cf-dr td{background:var(--surface)!important;border-bottom:1px solid var(--border)!important}
.cf-note{font-size:8px;color:var(--dim);margin-top:10px;padding:10px 12px;background:var(--surface);border-radius:8px;line-height:1.6}
.cf-note strong{color:var(--muted)}
.nb-x{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-top:12px}.nb-t{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:6px;font-weight:700}.ni{display:flex;align-items:flex-start;gap:6px;margin-bottom:6px;font-size:12px;line-height:1.5;color:var(--muted)}.ni .np{width:4px;height:4px;border-radius:50%;margin-top:4px;flex-shrink:0}.ni strong{color:var(--text);font-weight:600}
.ft{text-align:center;padding:20px 32px;font-size:8px;color:var(--dim);letter-spacing:1px}
@media(max-width:768px){.hd,.tabs,.fl,.wrap,.ft{padding-left:12px!important;padding-right:12px!important}.hv{font-size:28px!important}.tg{grid-template-columns:1fr 1fr}.og{grid-template-columns:1fr}.cw{height:180px}.bh{flex-direction:column;align-items:flex-start}.bh-n{font-size:16px}.bh-t{text-align:left;font-size:18px}.bs-g{grid-template-columns:1fr 1fr}.cf-cw{height:200px}}

.pend-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:28px;margin-bottom:20px}
.pend-t{width:100%;border-collapse:separate;border-spacing:0 6px}
.pend-t th{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:700;padding:10px 8px;text-align:left;border-bottom:2px solid var(--border)}
.pend-t td{padding:14px 10px;font-size:15px;border-bottom:1px solid var(--border);vertical-align:middle}
.pend-t tr:hover td{background:var(--surface)}
.pend-num{font-family:'Space Grotesk',sans-serif;font-weight:800;color:var(--white);font-size:15px;width:44px;text-align:center}
.pend-num span{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;background:var(--brand)}
.pend-proj{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.sem{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:12px}
.sem-r{background:#FEE2E2;color:#DC2626}.sem-y{background:#FEF3C7;color:#D97706}.sem-g{background:#D1FAE5;color:#059669}
.pend-legend{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.pend-legend .sem{font-size:10px}
.pend-subtitle{font-size:13px;color:var(--dim);margin-top:6px}

.pend-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pend-btn{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:6px;transition:all .2s}
.pend-btn:hover{opacity:.9;transform:translateY(-1px)}
.pend-btn.sec{background:var(--white);color:var(--brand);border:1.5px solid var(--brand)}
.pend-btn.sec:hover{background:var(--brand-soft)}
.pend-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1E1230;color:#fff;padding:12px 24px;border-radius:10px;font-size:12px;font-weight:600;display:none;z-index:999;box-shadow:0 4px 12px rgba(0,0,0,.2)}

.sim-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:16px}
.sim-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-end}
.sim-input-group{flex:1;min-width:140px}
.sim-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:700;margin-bottom:6px}
.sim-input{width:100%;border:2px solid var(--border);border-radius:10px;padding:12px 14px;font-size:16px;font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--brand);outline:none;transition:border .2s}
.sim-input:focus{border-color:var(--brand)}
.sim-input.sm{font-size:13px;padding:8px 10px}
.sim-preset{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.sim-chip{background:var(--surface);border:1.5px solid var(--border);border-radius:20px;padding:6px 14px;font-size:11px;font-weight:600;cursor:pointer;color:var(--muted);font-family:'Inter',sans-serif;transition:all .2s}
.sim-chip:hover{border-color:var(--brand);color:var(--brand)}
.sim-chip.a{background:var(--brand);border-color:var(--brand);color:#fff}
.sim-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.sim-box{background:var(--surface);border-radius:12px;padding:16px;text-align:center}
.sim-box-v{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:800}
.sim-box-l{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-top:4px}
.sim-tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.sim-t{width:100%;border-collapse:separate;border-spacing:0;min-width:800px}
.sim-t th{font-size:8px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;padding:8px 6px;text-align:right;border-bottom:2px solid var(--border)}
.sim-t th:first-child{text-align:left}
.sim-t td{padding:8px 6px;font-size:12px;text-align:right;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.sim-t td:first-child{text-align:left;font-weight:600;font-size:13px}
.sim-t tr.capex td{color:var(--brand)}
.sim-t tr.cg td{color:#059669}
.sim-t tr.cg input{width:80px;border:1.5px solid var(--border);border-radius:6px;padding:5px 6px;font-size:11px;font-family:'Space Grotesk',sans-serif;font-weight:600;color:#059669;text-align:right;outline:none}
.sim-t tr.cg input:focus{border-color:#059669}
.sim-t tr.total-row td{font-weight:800;font-size:13px;border-top:2px solid var(--brand);background:var(--brand-soft);color:var(--brand)}
.sim-t tr.pct-row td{font-size:10px;color:var(--muted);font-style:italic}
.sim-cw{position:relative;height:300px;margin-top:16px}
</style></head><body>

function parseBR(v){return parseFloat(String(v).replace(/\./g,'').replace(',','.'))||0;}
function fmtBR(v){return v.toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});}

function setCg(val){
document.getElementById('simCgTotal').value=fmtBR(val);

function toggleCapex(){

function simCalc(){
const months=CF.months;
const NM=months.length;

// Calculate active CAPEX
const capex=new Array(NM).fill(0);
const projData={};
CF.projects.forEach(p=>{
projData[p.key]={name:p.name,color:p.color,values:p.values};
if(simActiveProjects[p.key]){
for(let i=0;i<NM;i++)capex[i]+=p.values[i];
}
});
const totalCapex=capex.reduce((a,b)=>a+b,0);

// CG
const cgTotal=parseBR(document.getElementById('simCgTotal').value);
const cgMeses=parseInt(document.getElementById('simCgMeses').value)||NM;
const cg=new Array(NM).fill(0);
if(cgTotal>0&&cgMeses>0){
const cgPer=Math.round(cgTotal/cgMeses);
for(let i=0;i<Math.min(cgMeses,NM);i++)cg[i]=cgPer;
const diff=cgTotal-cg.reduce((a,b)=>a+b,0);
if(cgMeses<=NM)cg[cgMeses-1]+=diff;
}
const totalCg=cg.reduce((a,b)=>a+b,0);

const saldo=capex.map((v,i)=>cg[i]-v);const combined=saldo;
const totalSaldo=totalCg-totalCapex;const totalCombined=totalSaldo;

// Active count
const activeCount=Object.values(simActiveProjects).filter(v=>v).length;

// Summary
document.getElementById('simSummary').innerHTML=`
<div class="sim-box"><div class="sim-box-v" style="color:var(--brand)">R$ ${fmtBR(totalCapex)}</div><div class="sim-box-l">CAPEX (${activeCount} projetos)</div></div>
<div class="sim-box"><div class="sim-box-v" style="color:#059669">R$ ${fmtBR(totalCg)}</div><div class="sim-box-l">Capital de Giro</div></div>
<div class="sim-box" style="background:var(--brand-soft)"><div class="sim-box-v" style="color:var(--brand)">R$ ${fmtBR(totalCombined)}</div><div class="sim-box-l">Saldo (CG − CAPEX)</div></div>`;

// Table
let t=`<thead><tr><th>Linha</th>`;
months.forEach(m=>t+=`<th>${m}</th>`);
t+=`<th>Total</th></tr></thead><tbody>`;

// CAPEX row (clickable to expand)
t+=`<tr class="capex" style="cursor:pointer" onclick="toggleCapex()"><td><span id="capexArrow" style="font-size:9px;color:var(--dim);margin-right:4px">${simExpanded?'▼':'▶'}</span>📊 CAPEX</td>`;
capex.forEach(v=>t+=`<td>R$ ${fmtBR(v)}</td>`);
t+=`<td style="font-weight:800">R$ ${fmtBR(totalCapex)}</td></tr>`;

// Project detail rows
CF.projects.forEach(p=>{
const active=simActiveProjects[p.key];
const rowTotal=active?p.values.reduce((a,b)=>a+b,0):0;
t+=`<tr class="sim-proj-row" style="display:${simExpanded?'table-row':'none'};opacity:${active?1:0.3}">`;
t+=`<td style="padding-left:28px;font-size:12px"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${p.color};margin-right:6px;vertical-align:middle"></span>${p.name}</td>`;
p.values.forEach((v,mi)=>t+=`<td style="font-size:11px"><input class="sim-capex-input" data-proj="${p.key}" data-idx="${mi}" value="${active&&v>0?fmtBR(v):0}" style="width:80px;border:1.5px solid var(--border);border-radius:6px;padding:5px 6px;font-size:11px;font-family:'Space Grotesk',sans-serif;font-weight:600;color:${active?p.color:'var(--dim)'};text-align:right;outline:none;opacity:${active?1:0.3}" onchange="simCapexEdit()" ${active?'':'disabled'}></td>`);
t+=`<td style="font-size:11px;font-weight:700;color:${active?p.color:'var(--dim)'}" class="sim-proj-total" data-proj="${p.key}">${active?'R$ '+fmtBR(rowTotal):'excluído'}</td></tr>`;
});

// CG row (editable)
t+=`<tr class="cg"><td>💰 Capital de Giro</td>`;
cg.forEach((v,i)=>t+=`<td><input class="sim-cg-input" data-idx="${i}" value="${fmtBR(v)}" onchange="simManualCg()"></td>`);
t+=`<td style="font-weight:700;color:#059669">R$ ${fmtBR(totalCg)}</td></tr>`;

// Total
t+=`<tr class="total-row"><td>TOTAL MENSAL</td>`;
combined.forEach(v=>t+=`<td>R$ ${fmtBR(v)}</td>`);
t+=`<td>R$ ${fmtBR(totalCombined)}</td></tr>`;

// % CG
t+=`<tr class="pct-row"><td>Cobertura CG / CAPEX</td>`;
capex.forEach((v,i)=>t+=`<td style="color:${cg[i]>=v?'#059669':'#DC2626'}">${v>0?((cg[i]/v)*100).toFixed(0)+'%':'—'}</td>`);
t+=`<td style="color:${totalCg>=totalCapex?'#059669':'#DC2626'}">${totalCapex>0?((totalCg/totalCapex)*100).toFixed(0)+'%':'—'}</td></tr>`;

// Acumulado
let cumTot=0;
t+=`<tr class="pct-row"><td>Saldo Acumulado</td>`;
saldo.forEach(v=>{cumTot+=v;t+=`<td style="color:${cumTot>=0?'#059669':'#DC2626'}">${cumTot>=0?'':'− '}R$ ${fmtBR(Math.abs(cumTot))}</td>`;});
t+=`<td></td></tr></tbody>`;

document.getElementById('simTable').innerHTML=t;

// Chart
if(simChartInst)simChartInst.destroy();
const cumArr=[];let sc=0;saldo.forEach(v=>{sc+=v;cumArr.push(sc);});

const ctx=document.getElementById('simChart').getContext('2d');
simChartInst=new Chart(ctx,{type:'bar',data:{labels:months,datasets:[
{label:'CAPEX (necessidade)',data:[...capex],backgroundColor:'#3B275899',borderRadius:3,barPercentage:.35,categoryPercentage:.8},
{label:'Capital de Giro (disponível)',data:[...cg],backgroundColor:'#05966966',borderRadius:3,barPercentage:.35,categoryPercentage:.8},
{label:'Saldo Acumulado',data:cumArr,type:'line',borderColor:'#1E1230',backgroundColor:'transparent',borderWidth:2,pointRadius:3,pointBackgroundColor:'#1E1230',yAxisID:'y1',tension:.3},
]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{color:'#6B5F7A',font:{size:9},padding:8,usePointStyle:true}},tooltip:{backgroundColor:'#fff',titleColor:'#1E1230',bodyColor:'#6B5F7A',borderColor:'#E0D8E8',borderWidth:1,bodyFont:{size:10},callbacks:{label:c=>c.dataset.label+': R$ '+fmtBR(c.raw)}}},scales:{x:{stacked:false,grid:{display:false},ticks:{color:'#6B5F7A',font:{size:9}}},y:{stacked:false,grid:{color:'#E0D8E8'},ticks:{color:'#6B5F7A',font:{size:8},callback:v=>'R$ '+fmtBR(v)}},y1:{position:'right',grid:{display:false},ticks:{color:'#1E1230',font:{size:8},callback:v=>'R$ '+fmtBR(v)}}}}});
}
